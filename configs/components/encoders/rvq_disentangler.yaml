# configs/components/encoders/rvq_disentangler.yaml
defaults:
  - _self_
  - /components/layers@rvq: rvq_ema

_target_: quick_convert.components.encoders.RVQDisentangler
layer_transform: null
content_encoder:
  _target_: quick_convert.external.cosyvoice.transformer.upsample_encoder.UpsampleConformerEncoder
  input_size: ???
  output_size: 512
  attention_heads: 8
  linear_units: 2048
  num_blocks: 6
  dropout_rate: 0.1
  positional_dropout_rate: 0.1
  attention_dropout_rate: 0.1
  normalize_before: true
  input_layer: "linear"
  pos_enc_layer_type: "rel_pos_espnet"
  selfattention_layer_type: "rel_selfattn"
  use_cnn_module: false
  macaron_style: false
  static_chunk_size: 50
  do_upsample: false
  upsample_stride: 1
rvq:
  input_dim: ${..content_encoder.output_size}
  # errors out if true and ddp is not enabled. Need a better fix, because
  # this is not robust to standalone instantiations
  sync_codebook: ${pipeline.trainer.ddp.enabled}
router: ???
heads: ???
head_specs: ???
latent_reconstruction_loss_weight: 0.01

# Learned RVQ-layer router (the new mechanism): a small classifier learns which
# codebooks feed each attribute, producing routed outputs [speaker, content,
# prosody] (n_classes=3) plus a load-balancing loss. Swap this block for a fixed
# dict ({content,speaker,prosody,emotion} -> codebook idx) to use manual routing.
