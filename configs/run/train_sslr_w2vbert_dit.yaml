# @package _global_

defaults:
  - /global: default
  - /pipeline: training
  - /trainer: ssl_reconstruction
  - /system/reconstruction@system: w2vbert_dit_cosyvoice
  - /dataset@train_dataset: manifest
  - /dataset@val_dataset: manifest
  - /dataset@source_dataset: librispeech
  - _self_

dataset_name: ${hydra:runtime.choices.dataset@source_dataset}
dataset_path: ${out_root}/${dataset_name}

exp_name: ${hydra:runtime.choices.system/reconstruction@system}_${dataset_name}
project_name: ${hydra:runtime.choices.trainer}

data: &data
  load:
    - audio

train_dataset:
  <<: *data
  manifest_path: ${dataset_path}/speaker_split/train.csv

val_dataset:
  <<: *data
  manifest_path: ${dataset_path}/speaker_split/val.csv
