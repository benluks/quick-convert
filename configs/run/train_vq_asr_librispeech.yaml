# @package _global_

defaults:
  - /global: default
  - /pipeline: training
  - /trainer: vq_asr
  - /architecture/vq_asr@architecture: w2vbert_conformer
  - /dataset@train_dataset: manifest
  - /dataset@val_dataset: manifest
  - /dataset@source_dataset: librispeech
  - _self_

dataset_name: ${hydra:runtime.choices.dataset@source_dataset}

resources_root: outputs/precomputed
resources_path: ${resources_root}/${dataset_name}
dataset_path: ${out_root}/${dataset_name}
data_path_suffix: ""

pipeline:
  exp_name: ${hydra:runtime.choices.architecture/vq_asr@architecture}_${dataset_name}
  project_name: ${hydra:runtime.choices.trainer}

data: &data # compute info from sample
  resources:
    transcript:
      column: transcript
      kind: text
  resource_providers:
    - _target_: quick_convert.data.resources.PathResourceProvider
      kind: token_ids
      name: token_ids
      path_template: ${resources_path}/tokenizer/{sample.split}/{sample.utt_id}.pt

  load:
    - audio
    - token_ids

train_dataset:
  <<: *data
  manifest_path: ${dataset_path}/speaker_split/train${data_path_suffix}.csv

val_dataset:
  <<: *data
  manifest_path: ${dataset_path}/speaker_split/val${data_path_suffix}.csv
