# @package _global_

defaults:
  - /global: default
  - /pipeline: precompute_features
  - /dataset: iemocap
  - /components/feature_extractor@feature_extractor: speaker_embedding
  - /components/speaker_encoder@encoder: espnet
  - _self_

model_name: voxcelebs12_ecapa_wavlm_joint

dataset:
  load: true
  target_sr: ${encoder.sample_rate}

pipeline:
  dataset: ${dataset}
  extractor: ${feature_extractor}
  out_dir: ${out_root}/precomputed/speaker_embedding_espnet_${model_name}
