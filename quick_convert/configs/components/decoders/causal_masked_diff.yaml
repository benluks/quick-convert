_target_: quick_convert.components.decoders.CosyVoiceSpectrogramGenerator
feature_dim: ???
flow:
  _target_: quick_convert.external.cosyvoice.flow.flow.CausalMaskedDiffWithXvec
  input_size: 512
  output_size: 80
  spk_embed_dim: ???
  output_type: "mel"
  vocab_size: ???
  input_frame_rate: ???
  only_mask_loss: True
  token_mel_ratio: ???
  pre_lookahead_len: 3
  encoder:
    _target_: quick_convert.external.cosyvoice.transformer.upsample_encoder.UpsampleConformerEncoder
    output_size: 512
    attention_heads: 8
    linear_units: 2048
    num_blocks: 6
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.1
    normalize_before: True
    input_layer: "linear"
    pos_enc_layer_type: "rel_pos_espnet"
    selfattention_layer_type: "rel_selfattn"
    input_size: 512
    use_cnn_module: False
    macaron_style: False
    static_chunk_size: ${..input_frame_rate}
  decoder:
    _target_: quick_convert.external.cosyvoice.flow.flow_matching.CausalConditionalCFM
    in_channels: 240
    n_spks: 1
    spk_emb_dim: 80
    cfm_params:
      _target_: omegaconf.DictConfig
      content:
        sigma_min: 1e-06
        solver: "euler"
        t_scheduler: "cosine"
        training_cfg_rate: 0.2
        inference_cfg_rate: 0.7
        reg_loss_type: "l1"
    estimator:
      _target_: quick_convert.external.cosyvoice.flow.decoder.CausalConditionalDecoder
      in_channels: 320
      out_channels: 80
      channels: [256]
      dropout: 0.0
      attention_head_dim: 64
      n_blocks: 4
      num_mid_blocks: 12
      num_heads: 8
      act_fn: "gelu"
      static_chunk_size: ${floor:50, ${...token_mel_ratio}}
      num_decoding_left_chunks: -1
