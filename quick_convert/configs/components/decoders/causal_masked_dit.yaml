_target_: quick_convert.components.decoders.CosyVoiceSpectrogramGenerator
feature_dim: ???
flow:
  _target_: quick_convert.external.cosyvoice.flow.flow.CausalMaskedDiffWithDiT
  input_size: 80
  output_size: 80
  spk_embed_dim: ???
  output_type: "mel"
  vocab_size: ???
  input_frame_rate: ???
  only_mask_loss: True
  token_mel_ratio: ???
  pre_lookahead_len: 3
  pre_lookahead_layer:
    _target_: quick_convert.external.cosyvoice.transformer.upsample_encoder.PreLookaheadLayer
    in_channels: 80
    channels: 1024
    pre_lookahead_len: 3
  decoder:
    _target_: quick_convert.external.cosyvoice.flow.flow_matching.CausalConditionalCFM
    in_channels: 240
    n_spks: 1
    spk_emb_dim: 80
    cfm_params:
      _target_: omegaconf.DictConfig
      content:
        sigma_min: 1e-06
        solver: "euler"
        t_scheduler: "cosine"
        training_cfg_rate: 0.2
        inference_cfg_rate: 0.7
        reg_loss_type: "l1"
    estimator:
      _target_: quick_convert.external.cosyvoice.flow.DiT.dit.DiT
      dim: 1024
      depth: 22
      heads: 16
      dim_head: 64
      ff_mult: 2
      mel_dim: 80
      mu_dim: 80
      spk_dim: 80
      out_channels: 80
      static_chunk_size: ${mul:25,${...token_mel_ratio}}
      num_decoding_left_chunks: -1
