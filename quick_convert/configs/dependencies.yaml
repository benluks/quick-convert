# Optional installation capabilities selected by configured Python targets.
# Keep package versions in pyproject.toml; this file maps semantic capabilities
# to import probes and composed object-graph targets.
extras:
  opensmile:
    probes: [opensmile]
  asr:
    probes: [jiwer, sentencepiece]
  cosyvoice:
    probes: [diffusers, librosa, onnxruntime, x_transformers]
  dac:
    probes: [dac]
  emotion2vec:
    probes: [funasr]
  espnet-wavlm-joint:
    probes: [espnet2, s3prl]
  manifests:
    probes: [pandas]
  mpm:
    probes: [masked_prosody_model]
  pase:
    probes: [pase, torchvision]
  spear:
    probes: [transformers]
  pyannote:
    probes: [pyannote.audio]
  sentencepiece:
    probes: [sentencepiece]
  speechbrain:
    probes: [speechbrain]
  speechbrain-ser:
    probes: [speechbrain, transformers]
  training:
    probes: [lightning, matplotlib, tensorboard, wandb]
  transformers:
    probes: [transformers]
  voicefm:
    probes: [transformers]
  wer:
    probes: [jiwer]
  whisper:
    probes: [whisper]
  yaapt:
    probes: [amfm_decompy]

targets:
  quick_convert.components.feature_extractors.prosody.OpenSmileProsodyExtractor: [opensmile]
  quick_convert.components.decoders.CosyVoiceSpectrogramGenerator: [cosyvoice]
  quick_convert.components.feature_extractors.TokenizerFeatureExtractor: [sentencepiece]
  quick_convert.components.speaker.speaker_encoders.CosyVoiceCAMPPlusSpeakerEncoder: [cosyvoice]
  quick_convert.components.speaker.ESPnetSpeakerEncoder: [espnet-wavlm-joint]
  quick_convert.components.speaker.PyannoteWeSpeakerEncoder: [pyannote]
  quick_convert.components.speaker.SpeechBrainECAPASpeakerEncoder: [speechbrain]
  quick_convert.components.decoders.PSST1Vocoder: [yaapt]
  quick_convert.components.feature_extractors.YAAPTF0Extractor: [yaapt]
  quick_convert.components.ssl.DACContentEncoder: [dac]
  quick_convert.components.ssl.EmotionEncoder: [emotion2vec]
  quick_convert.components.ssl.PASEContentEncoder: [pase]
  quick_convert.components.ssl.SPEARContentEncoder: [spear]
  quick_convert.components.ssl.ProsodyEncoder: [mpm]
  quick_convert.components.ssl.S3TokenizerContentEncoder: [s3tokenizer]
  quick_convert.components.ssl.W2VBertContentEncoder: [transformers]
  quick_convert.components.ssl.VoiceFMContentEncoder: [voicefm]
  quick_convert.components.ssl.WavLMContentEncoder: [transformers]
  quick_convert.pipelines.evaluation.metrics.JiwerWER: [wer]
  quick_convert.systems.asr.WhisperASR: [whisper]
  quick_convert.systems.ser.odyssey_ser.OdysseySER: [transformers]
  quick_convert.systems.ser.speechbrain_ser.SpeechBrainSER: [speechbrain-ser]
  quick_convert.systems.anonymization.PSST1Anonymizer: [speechbrain, yaapt]
  quick_convert.training.lightning.modules.vq_asr.VQASRTrainingModule: [asr, training]
  quick_convert.training.lightning.modules.ssl_reconstruction.SSLReconstructionTrainingModule: [training]
  quick_convert.training.lightning.modules.speaker_generator.SpeakerGeneratorTrainingModule: [training]
  quick_convert.training.lightning.trainer.LightningTrainer: [training]
  quick_convert.training.tokenizer.TokenizerTrainer: [sentencepiece]
  quick_convert.training.tokenizers.sentencepiece.SentencePieceBPETrainer: [sentencepiece]
