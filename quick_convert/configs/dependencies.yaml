# Optional installation capabilities selected by configured Python targets.
# Keep package versions in pyproject.toml; this file maps semantic capabilities
# to import probes and composed object-graph targets.
extras:
  campplus:
    probes: [onnx, onnxruntime, huggingface_hub]
  opensmile:
    probes: [opensmile]
  asr:
    probes: [jiwer, sentencepiece]
  cosyvoice:
    probes: [diffusers, librosa, onnxruntime, x_transformers]
  dac:
    probes: [dac]
  emotion2vec:
    probes: [funasr]
  espnet-wavlm-joint:
    probes: [espnet2, s3prl]
  manifests:
    probes: [pandas]
  mpm:
    probes: [masked_prosody_model]
  pase:
    probes: [pase, torchvision]
  spear:
    probes: [transformers]
  pyannote:
    probes: [pyannote.audio]
  sentencepiece:
    probes: [sentencepiece]
  speechbrain:
    probes: [speechbrain]
  speechbrain-ser:
    probes: [speechbrain, transformers]
  training:
    probes: [lightning, matplotlib, tensorboard, wandb]
  transformers:
    probes: [transformers]
  mimi:
    probes: [transformers]
  speechtokenizer:
    probes: [speechtokenizer, huggingface_hub, beartype, tensorboard]
  voicefm:
    probes: [transformers]
  wer:
    probes: [jiwer]
  whisper:
    probes: [whisper]
  yaapt:
    probes: [amfm_decompy]

targets:
  quick_convert.components.encoders.speaker.CosyVoiceCAMPPlusSpeakerEncoder: [campplus]
  quick_convert.data.resources.SameSpeakerReferenceProvider: [manifests]
  quick_convert.components.sequence.upsample_conformer.UpsampleConformerEncoder: [cosyvoice]
  # Saved-system targets are inspected by the planner; loaders themselves need only base dependencies.
  quick_convert.inference.load_inference_system: []
  quick_convert.inference.load_system_from_run: []
  quick_convert.inference.load_inference_artifact: []
  quick_convert.components.features.opensmile.OpenSmileProsodyExtractor: [opensmile]
  quick_convert.components.generators.acoustic.CosyVoiceSpectrogramGenerator: [cosyvoice]
  quick_convert.components.resources.tokenizer.TokenizerFeatureExtractor: [sentencepiece]
  quick_convert.components.encoders.speaker.ESPnetSpeakerEncoder: [espnet-wavlm-joint]
  quick_convert.components.encoders.speaker.PyannoteWeSpeakerEncoder: [pyannote]
  quick_convert.components.encoders.speaker.SpeechBrainECAPASpeakerEncoder: [speechbrain]
  quick_convert.components.features.f0.yaapt.YAAPTF0Extractor: [yaapt]
  quick_convert.components.encoders.content.DACContentEncoder: [dac]
  quick_convert.components.encoders.content.DACQuantizedContentEncoder: [dac]
  quick_convert.components.encoders.content.quantized.DACQuantizedContentEncoder: [dac]
  quick_convert.components.encoders.content.MimiQuantizedContentEncoder: [mimi]
  quick_convert.components.encoders.content.quantized.MimiQuantizedContentEncoder: [mimi]
  quick_convert.components.encoders.content.SpeechTokenizerQuantizedContentEncoder: [speechtokenizer]
  quick_convert.components.encoders.content.quantized.SpeechTokenizerQuantizedContentEncoder: [speechtokenizer]
  # The nested saved system selects the content backend's requirements.
  quick_convert.components.encoders.content.VQASRContentEncoder: []
  quick_convert.components.encoders.content.vq_asr.VQASRContentEncoder: []
  quick_convert.components.encoders.content.EmotionEncoder: [emotion2vec]
  quick_convert.components.encoders.content.PASEContentEncoder: [pase]
  quick_convert.components.encoders.content.SPEARContentEncoder: [spear]
  quick_convert.components.encoders.content.ProsodyEncoder: [mpm]
  quick_convert.components.encoders.content.S3TokenizerContentEncoder: [s3tokenizer]
  quick_convert.components.encoders.content.W2VBertContentEncoder: [transformers]
  quick_convert.components.encoders.content.VoiceFMContentEncoder: [voicefm]
  quick_convert.components.encoders.content.WavLMContentEncoder: [transformers]
  quick_convert.pipelines.evaluation.metrics.JiwerWER: [wer]
  quick_convert.systems.asr.WhisperASR: [whisper]
  quick_convert.systems.ser.odyssey_ser.OdysseySER: [transformers]
  quick_convert.systems.ser.speechbrain_ser.SpeechBrainSER: [speechbrain-ser]
  quick_convert.systems.conversion.PSST1ConversionSystem: [speechbrain, yaapt]
  quick_convert.training.lightning.modules.vq_asr.VQASRTrainingModule: [asr, training]
  quick_convert.training.lightning.modules.ssl_reconstruction.SSLReconstructionTrainingModule: [training]
  quick_convert.training.lightning.modules.speaker_generator.SpeakerGeneratorTrainingModule: [training]
  quick_convert.training.lightning.trainer.LightningTrainer: [training]
  quick_convert.training.tokenizer.TokenizerTrainer: [sentencepiece]
  quick_convert.training.tokenizers.sentencepiece.SentencePieceBPETrainer: [sentencepiece]
