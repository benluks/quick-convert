# @package _global_

defaults:
  - /global: default
  - /dataset: librispeech
  - /pipeline: evaluation
  - /asr@system: whisper
  - /resource_providers/librispeech@transcript_provider: transcript
  - _self_

system:
  model_name: tiny.en

dataset:
  splits:
    - test-other
  load: true
  target_sr: ${system.sr}
  resource_providers:
    - ${transcript_provider}

ref_dataset: null

metrics:
  - _target_: quick_convert.pipelines.evaluation.metrics.JiwerWER
