# @package _global_

# Minimal executable stream example; add named mel-clock resources for more controls.
defaults:
  - train_sslr_w2vbert_dit
  - _self_

exp_name: ${hydra:job.config_name}_${dataset_name}

system:
  decoder:
    stream_conditioning:
      _target_: quick_convert.components.decoders.StreamConditioning
      dimensions:
        mel: 80
    flow:
      decoder:
        estimator:
          cond_dim: 81  # 80 mel channels + one availability indicator
