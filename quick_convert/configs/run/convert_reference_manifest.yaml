# @package _global_
defaults:
  - /global: default
  - /dataset: manifest
  - /components/speaker_aggregation@pipeline.target.aggregation: null
  - _self_

source: ???
checkpoint: null
manifest_path: ???
dataset_name: ${path_stem:${manifest_path}}
target_paths: ???

system:
  _target_: quick_convert.inference.load_inference_system
  source: ${source}
  checkpoint: ${checkpoint}
  map_location: ${device}

dataset:
  manifest_path: ${manifest_path}
  load: [audio]

pipeline:
  _target_: quick_convert.pipelines.conversion.SpeechConversionPipeline
  system: ${system}
  dataset: ${dataset}
  target:
    _target_: quick_convert.systems.anonymization.targets.ReferenceSpeech
    paths: ${target_paths}
    prompt_seconds: 3.0
    prompt_builder:
      _target_: quick_convert.components.reference_prompt.SpeechPromptBuilder
  metadata:
    system: speech-conversion
    dataset: ${dataset_name}
    dataset_manifest: ${manifest_path}
    source: ${source}
    checkpoint: ${checkpoint}
  out_dir: ${conversion_dir:${out_root},${pipeline.metadata},${pipeline.target},${out_dir_suffix}}
