# @package _global_

defaults:
  - /global: default
  - /pipeline: training
  - /trainer: ssl_reconstruction
  - /system/conversion@system: vq_asr_dit_cosyvoice
  - /dataset@train_dataset: manifest
  - /dataset@val_dataset: manifest
  - /dataset@source_dataset: librispeech
  - _self_

vq_asr_checkpoint: ???
vq_asr_config: null

dataset_name: ${hydra:runtime.choices.dataset@source_dataset}
dataset_path: ${out_root}/${dataset_name}

data_file_suffix: "_cfs"

exp_name: ${hydra:runtime.choices.system/conversion@system}_${dataset_name}
project_name: ${hydra:runtime.choices.trainer}

data: &data
  target_sr: 16000
  load:
    - audio

train_dataset:
  <<: *data
  manifest_path: ${dataset_path}/speaker_split/train${data_file_suffix}.csv

val_dataset:
  <<: *data
  manifest_path: ${dataset_path}/speaker_split/val${data_file_suffix}.csv
