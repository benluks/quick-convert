# @package _global_

defaults:
  - train_sslr_w2vbert_dit_campp_prefix
  - override /components/ssl@system.online_encoders.content: w2vbert_last_layer
  - _self_

# Original-audio manifests, paired with mirrored TTS FLAC recordings.
exp_name: tts_content_conformer_dit_cosyvoice_${dataset_name}
tts_data_path: ???
reference_seconds: 3.0
reference_seed: 0

trainer:
  module:
    reference_seconds: ${reference_seconds}
    content_audio_resource: tts_path

data:
  target_sr: 16000

system:
  feature_transform: null
  decoder:
    feature_dim: 1024
    stream_conditioning:
      # Reference audio is independent of the continuation; allow longer context.
      prefix_fraction: [0.5, 1.0]
    content_encoder:
      _target_: quick_convert.components.encoders.upsample_conformer.UpsampleConformerEncoder
      input_size: ${..feature_dim}
      output_size: 256
      num_blocks: 6
    flow:
      input_frame_rate: 50
      token_mel_ratio: 1
      pre_lookahead_layer: null

train_dataset:
  manifest_path: ${dataset_path}/speaker_split/train_tts_checked.csv
  target_sr: 16000
  load: [audio]
  resource_providers:
    - _target_: quick_convert.data.resources.TemplateResourceProvider
      name: tts_path
      template: ${tts_data_path}/{path.parent.parent.parent.name}/{path.parent.parent.name}/{path.parent.name}/{path.stem}.flac
    - _target_: quick_convert.data.resources.SameSpeakerReferenceProvider
      manifest_path: ${train_dataset.manifest_path}
      seed: ${reference_seed}
val_dataset:
  manifest_path: ${dataset_path}/speaker_split/val_tts_checked.csv
  target_sr: 16000
  load: [audio]
  resource_providers:
    - ${train_dataset.resource_providers.0}
    - _target_: quick_convert.data.resources.SameSpeakerReferenceProvider
      manifest_path: ${val_dataset.manifest_path}
      seed: ${reference_seed}
