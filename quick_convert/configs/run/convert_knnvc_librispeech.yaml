# @package _global_
defaults:
  - /recipe: convert_knnvc
  - /dataset: librispeech
  - override /reference_dataset: librispeech
  - _self_

root: ???
source_split: test-clean
# Omit this option to convert every speaker in the split.
source_speaker: "*"
target_root: ${root}

dataset:
  root: ${root}
  splits: ["${source_split}"]
  pattern: "${source_speaker}/*/*.flac"
pipeline:
  metadata:
    system: knnvc
    dataset: librispeech
    source_split: ${source_split}
    source_speaker: ${source_speaker}
