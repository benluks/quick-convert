# configs/trainer/optimizer/adamw_onecycle.yaml

_target_: quick_convert.training.lightning.optim.Optimization

optimizer:
  _target_: hydra.utils.get_class
  path: torch.optim.AdamW

optimizer_kwargs:
  lr: 2.0e-4
  betas: [0.9, 0.999]
  weight_decay: 0.01

lr_scheduler:
  _target_: hydra.utils.get_class
  path: torch.optim.lr_scheduler.OneCycleLR

lr_scheduler_kwargs:
  max_lr: ${..optimizer_kwargs.lr}
  total_steps: auto
  pct_start: 0.1
  anneal_strategy: cos
  div_factor: 25.0
  final_div_factor: 1000.0

warmup: null
interval: step
frequency: 1
monitor: null
