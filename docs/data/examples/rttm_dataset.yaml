# Set this to the directory holding the example tables, audio and annotations.
data_root: ???

dataset:
  _target_: quick_convert.data.BaseDataset
  load: [audio]
  target_sr: 16000
  rows: ${segment_index}

segment_index:
  _target_: quick_convert.data.recording_index.segment_rows
  recording_id_column: take
  audio_path: "${data_root}/audio/{session}/{sequence}.wav"
  annotation_path: "${data_root}/annotations/{take}.rttm"
  interval_reader:
    _target_: quick_convert.data.recording_index.read_rttm_intervals
    _partial_: true
  speaker: "{reader_track}"
  resources:
    spkid: linked_reader
  rows:
    _target_: quick_convert.data.recording_index.join_index
    key_columns: [reader]
    rows:
      _target_: quick_convert.data.recording_index.split_index_column
      column: take
      separator: "-"
      output_columns: [session, sequence]
      rows:
        _target_: quick_convert.data.recording_index.read_csv_index
        path: ${data_root}/takes.csv
        columns: [take, reader, reader_track]
    lookup:
      _target_: quick_convert.data.recording_index.link_identities
      id_column: reader
      links_column: aliases
      output_column: linked_reader
      separator: ";"
      rows:
        _target_: quick_convert.data.recording_index.read_csv_index
        path: ${data_root}/readers.csv
        columns: [reader, aliases]

# Optional: set dataset.rows to ${bounded_segment_index} to clip annotated
# ends to the audio stream duration and exclude starts at/after EOF.
# Use the same bounded index as the input to any fold selection.
bounded_segment_index:
  _target_: quick_convert.data.recording_index.clip_segment_rows
  rows: ${segment_index}
  report_path: outputs/data/segment_boundaries.json
