name: Notify private downstream

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || vars.PRIVATE_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger downstream integration
        env:
          TRIGGER_URL: ${{ secrets.GITLAB_SYNC_TRIGGER_URL }}
          TRIGGER_TOKEN: ${{ secrets.GITLAB_SYNC_TRIGGER_TOKEN }}
        run: |
          test -n "$TRIGGER_URL" && test -n "$TRIGGER_TOKEN"
          curl --fail --silent --show-error --max-time 60 --output /dev/null \
            --request POST \
            --form-string "token=$TRIGGER_TOKEN" \
            --form-string 'ref=main' \
            "$TRIGGER_URL"
