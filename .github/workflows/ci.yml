name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "integration/**"
      - "llm/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install development environment
        run: uv sync --group dev
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Lint
        run: uv run --no-sync ruff check --select B,E4,E7,E9,F,I,UP .
      - name: Run fast tests
        run: uv run --no-sync pytest
      - name: Verify installed wheel
        run: |
          uv build --wheel
          python -m venv /tmp/quick-convert-wheel-smoke
          /tmp/quick-convert-wheel-smoke/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/quick-convert-wheel-smoke/bin/quick-convert --help 2>&1 | grep train_vq_asr_librispeech
